<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Leaflet — PDF eBook Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <header id="toolbar">
    <div class="brand">
      <span class="brand-mark">Le</span><span class="brand-name">Leaflet</span>
    </div>

    <div class="toolbar-scroll">

      <div class="toolbar-group">
        <button id="importBtn" class="tbtn tbtn-primary" title="Open a PDF">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Import</span>
        </button>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <button id="prevBtn" class="tbtn" title="Previous page" disabled>
          <svg viewBox="0 0 24 24" class="icon"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <form id="pageForm" class="page-finder" autocomplete="off">
          <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" disabled aria-label="Page number">
          <span class="page-sep">/</span>
          <span id="pageCount">0</span>
        </form>
        <button id="nextBtn" class="tbtn" title="Next page" disabled>
          <svg viewBox="0 0 24 24" class="icon"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <button id="zoomOutBtn" class="tbtn" title="Zoom out" disabled>
          <svg viewBox="0 0 24 24" class="icon"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span id="zoomLevel" class="zoom-level">100%</span>
        <button id="zoomInBtn" class="tbtn" title="Zoom in" disabled>
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group">
        <button id="lensBtn" class="tbtn" title="Select text to copy (OCR)" disabled>
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 1-1-1h-3M4 16v3a1 1 0 0 0 1 1h3M20 16v3a1 1 0 0 1-1 1h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Lens</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <div class="toolbar-group swatches">
        <label class="color-field" title="Page background color">
          <input type="color" id="bgColorPicker" value="#f3e9d2">
          <span class="color-tag">Page</span>
        </label>
        <label class="color-field" title="Text color">
          <input type="color" id="textColorPicker" value="#2a2118">
          <span class="color-tag">Ink</span>
        </label>
        <button id="resetColorsBtn" class="tbtn tbtn-ghost" title="Reset to original colors">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 4v6h6M20 20v-6h-6M4.5 15A8 8 0 0 0 19 8.5M19.5 9A8 8 0 0 0 5 15.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

    </div>
  </header>

  <main id="stage">

    <div id="placeholder">
      <div class="placeholder-book">
        <div class="pb-cover"></div>
        <div class="pb-cover pb-cover-2"></div>
      </div>
      <p class="placeholder-title">No book open</p>
      <p class="placeholder-sub">Import a PDF to start reading it as a book.</p>
      <button id="placeholderImportBtn" class="tbtn tbtn-primary">Import a PDF</button>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p id="loadingText">Opening book…</p>
    </div>

    <div id="bookViewer" class="hidden">
      <button id="edgePrev" class="edge-tap edge-prev" aria-label="Previous page"></button>
      <div class="book" id="book">
        <div class="page-panel" id="leftPanel">
          <canvas id="leftCanvas"></canvas>
          <span class="page-num-label" id="leftPageLabel"></span>
        </div>
        <div class="spine"></div>
        <div class="page-panel" id="rightPanel">
          <canvas id="rightCanvas"></canvas>
          <span class="page-num-label" id="rightPageLabel"></span>
        </div>
      </div>
      <button id="edgeNext" class="edge-tap edge-next" aria-label="Next page"></button>
    </div>

  </main>

  <!-- Lens: full-viewport drag-to-select overlay, shown only while lens mode is active -->
  <div id="lensOverlay" class="hidden">
    <p id="lensHint" class="lens-hint">Drag a box around the text you want to copy</p>
    <div id="selectionBox" class="hidden"></div>
  </div>

  <!-- Lens result bar: slides up from the bottom with the OCR'd text -->
  <div id="ocrBar" class="hidden">
    <div class="ocr-bar-header">
      <span id="ocrStatus">Reading text…</span>
      <button id="ocrCloseBtn" class="tbtn tbtn-ghost" title="Close">
        <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="ocrTextWrap" class="hidden">
      <textarea id="ocrText" readonly spellcheck="false"></textarea>
      <button id="ocrCopyBtn" class="tbtn tbtn-primary" title="Copy text">
        <svg viewBox="0 0 24 24" class="icon"><path d="M8 8V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-3M8 8H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2M8 8h6a1 1 0 0 1 1 1v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Copy</span>
      </button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="script.js"></script>
</body>
</html>
